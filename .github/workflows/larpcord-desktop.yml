name: Larpcord Desktop (Standalone Windows Preview)

on:
  push:
    branches: [larpcord-development]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: larpcord-standalone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Build the Larpcord client mod
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm testTsc
      - run: pnpm buildStandalone
      - name: Verify our own Equibop-compatible client
        run: test -s dist/equibop.asar
      - uses: actions/upload-artifact@v4
        with:
          name: larpcord-custom-client
          path: dist/equibop.asar
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Package independent Larpcord.exe
    needs: client
    runs-on: windows-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: larpcord-custom-client
          path: dist
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch pinned GPL-compatible Equibop shell
        shell: pwsh
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/Equicord/Equibop.git .larpcord-shell
          git -C .larpcord-shell fetch --depth=1 origin 57406f627221bc6054deb9834c18fa9cd914d96a
          git -C .larpcord-shell checkout --detach 57406f627221bc6054deb9834c18fa9cd914d96a
      - name: Install shell dependencies from its pinned lockfile
        working-directory: .larpcord-shell
        run: bun install --frozen-lockfile
      - name: Embed our Larpcord client and set independent Windows identity
        run: node scripts/larpcord/configure-shell.mjs .larpcord-shell
      - name: Generate pink cat-only Windows icons
        shell: pwsh
        run: |
          python -m pip install "Pillow==11.3.0"
          python scripts/larpcord/make-icons.py .larpcord-shell
      - name: Build Electron shell
        working-directory: .larpcord-shell
        run: bun run build
      - name: Package unsigned standalone Windows setup
        working-directory: .larpcord-shell
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: bunx electron-builder --win nsis --x64 --publish never
      - name: Verify bundled client and independent installer
        shell: pwsh
        run: |
          if (-not (Test-Path .larpcord-shell/dist/win-unpacked/resources/larpcord.asar)) { throw "The custom Larpcord client bundle is missing!" }
          $setups = @(Get-ChildItem .larpcord-shell/dist -Filter "Larpcord-Setup-*.exe" -File)
          if ($setups.Count -ne 1) { throw "Expected exactly one standalone Larpcord installer." }
          if (-not (Test-Path .larpcord-shell/dist/latest.yml)) { throw "Missing latest.yml; in-app updates cannot function." }
          $blockmaps = @(Get-ChildItem .larpcord-shell/dist -Filter "Larpcord-Setup-*.exe.blockmap" -File)
          if ($blockmaps.Count -ne 1) { throw "Expected exactly one installer blockmap." }
          $setups | ForEach-Object { Write-Host "$($_.Name) — $($_.Length) bytes" }
      - uses: actions/upload-artifact@v4
        with:
          name: larpcord-windows-standalone-preview
          path: |
            .larpcord-shell/dist/Larpcord-Setup-*.exe
            .larpcord-shell/dist/Larpcord-Setup-*.exe.blockmap
            .larpcord-shell/dist/latest.yml
          if-no-files-found: error
          retention-days: 14
      - name: Publish v0.1.1 prerelease and auto-update metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content .larpcord-shell/package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^[0-9]+[.][0-9]+[.][0-9]+') { throw "Invalid release version: $version" }
          $tag = "v$version"
          $dir = ".larpcord-shell/dist"
          $setup = @(Get-ChildItem $dir -Filter "Larpcord-Setup-*.exe" -File)
          $blockmap = @(Get-ChildItem $dir -Filter "Larpcord-Setup-*.exe.blockmap" -File)
          $manifest = Join-Path $dir "latest.yml"
          if ($setup.Count -ne 1 -or $blockmap.Count -ne 1 -or -not (Test-Path $manifest)) { throw "Missing release artifacts" }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; leaving immutable release assets unchanged."
          } else {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --title "Larpcord v$version" --notes "Standalone Windows preview with in-app updater. Unsigned build; install only from this project's GitHub releases." $setup[0].FullName $blockmap[0].FullName $manifest
            if ($LASTEXITCODE -ne 0) { throw "GitHub release publishing failed" }
          }
