name: Larpcord PR checks
on:
  pull_request:
    branches: [larpcord-development]
permissions:
  contents: read
jobs:
  client:
    name: Typecheck and build Larpcord
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm testTsc
      - run: pnpm buildStandalone
