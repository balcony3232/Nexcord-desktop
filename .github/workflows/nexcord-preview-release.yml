name: Nexcord Preview Release

on:
  push:
    branches: [nexcord-development]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexcord-preview-release
  cancel-in-progress: false

jobs:
  bundle:
    name: Build client bundle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm testTsc
      - run: pnpm buildStandalone
      - name: Verify client bundle
        run: test -s dist/desktop.asar
      - uses: actions/upload-artifact@v4
        with:
          name: nexcord-client-bundle
          path: dist/desktop.asar
          if-no-files-found: error
          retention-days: 14

  installer:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish standalone installer
        run: dotnet publish installer/NexcordInstaller.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o installer/out
      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path installer/out/NexcordInstaller.exe)) { throw "Missing NexcordInstaller.exe" }
      - name: Self-test installer patch/restore in temporary directory
        shell: pwsh
        run: |
          & installer/out/NexcordInstaller.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "Nexcord installer self-test failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: nexcord-windows-installer
          path: installer/out/NexcordInstaller.exe
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified development preview
    runs-on: ubuntu-latest
    needs: [bundle, installer]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nexcord-client-bundle
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: nexcord-windows-installer
          path: release
      - name: Verify release files and checksums
        run: |
          test -s release/desktop.asar
          test -s release/NexcordInstaller.exe
          cd release
          sha256sum desktop.asar NexcordInstaller.exe > SHA256SUMS.txt
      - name: Publish/update prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:12}"
          TITLE="Nexcord Preview ${SHORT_SHA}"
          if gh release view nexcord-dev >/dev/null 2>&1; then
            gh release upload nexcord-dev release/desktop.asar release/NexcordInstaller.exe release/SHA256SUMS.txt --clobber
            gh release edit nexcord-dev --title "$TITLE" --notes "Nexcord Desktop v0.1 preview from ${GITHUB_SHA}. Install on Discord PTB/Canary first. This is a test release, not production stable."
          else
            gh release create nexcord-dev release/desktop.asar release/NexcordInstaller.exe release/SHA256SUMS.txt --target "${GITHUB_SHA}" --title "$TITLE" --notes "Nexcord Desktop v0.1 preview from ${GITHUB_SHA}. Install on Discord PTB/Canary first. This is a test release, not production stable." --prerelease
          fi
